name: Install Race Intelligence 3D V10

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: install-race-intelligence-v10
  cancel-in-progress: true

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout bootstrap commit
        uses: actions/checkout@v4

      - name: Reconstruct complete V10 source tree
        shell: bash
        run: |
          cat .bootstrap/source.b64.part* | base64 --decode > /tmp/race-intelligence-v10.zip
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .bootstrap -exec rm -rf {} +
          unzip -q /tmp/race-intelligence-v10.zip -d .
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap.yml

      - name: Publish permanent source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Rebuild Race Intelligence 3D V10"
          git push
